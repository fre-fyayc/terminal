"$schema" = 'https://starship.rs/config-schema.json'

# Dracula-Segmente:
# Username:      #bd93f9 (Dracula Purple)
# Directory:     #6272a4 (Dracula Comment / Muted Blue)
# Git:           #ff79c6 (Dracula Pink)
# Languages:     #8be9fd (Dracula Cyan)
# Docker:        #50fa7b (Dracula Green)
# Time:          #44475a (Dracula Current Line)

format = """
[](#bd93f9)\
$os\
$username\
[](bg:#6272a4 fg:#bd93f9)\
$directory\
[](fg:#6272a4 bg:#ff79c6)\
$git_branch\
$git_status\
[](fg:#ff79c6 bg:#8be9fd)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#8be9fd bg:#50fa7b)\
$docker_context\
[](fg:#50fa7b bg:#44475a)\
$time\
[ ](fg:#44475a)\
"""

[username]
show_always = true
style_user = "bg:#bd93f9 fg:#282a36 bold"
style_root = "bg:#bd93f9 fg:#282a36 bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#bd93f9 fg:#282a36"
disabled = true

[directory]
style = "bg:#6272a4 fg:#f8f8f2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#ff79c6 fg:#282a36 bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#ff79c6 fg:#282a36"
format = '[$all_status$ahead_behind ]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#ff79c6 fg:#282a36"
format = '[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ]($style)'

[jj_status]
style = "bg:#ff79c6 fg:#282a36"
format = '[$all ]($style)'

# --- Programmiersprachen & Runtimes (Cyan / #8be9fd) ---

[c]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[gradle]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[maven]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#8be9fd fg:#282a36"
format = '[ $symbol ($version) ]($style)'

# --- Tools & Status ---

[docker_context]
symbol = " "
style = "bg:#50fa7b fg:#282a36"
format = '[ $symbol $context ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#44475a fg:#f8f8f2"
format = '[ ♥ $time ]($style)'